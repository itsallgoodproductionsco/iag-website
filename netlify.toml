# =============================================
# NETLIFY CONFIGURATION
# It's All Good Productions
# =============================================

[build]
publish = "."

# ---- Redirect the retired Wix domain ----
# Domain-level redirects must put the source domain in `from`.
# (Netlify redirect conditions support Country/Language/Role/Cookie only,
#  NOT Host, so a Host condition never matches.)
[[redirects]]
from = "https://itsallgoodproductionsla.com/*"
to = "https://www.itsallgoodproductions.com/:splat"
status = 301
force = true

[[redirects]]
from = "http://itsallgoodproductionsla.com/*"
to = "https://www.itsallgoodproductions.com/:splat"
status = 301
force = true

[[redirects]]
from = "https://www.itsallgoodproductionsla.com/*"
to = "https://www.itsallgoodproductions.com/:splat"
status = 301
force = true

[[redirects]]
from = "http://www.itsallgoodproductionsla.com/*"
to = "https://www.itsallgoodproductions.com/:splat"
status = 301
force = true

# ---- Security & performance headers ----
[[headers]]
for = "/*"
[headers.values]
X-Frame-Options = "SAMEORIGIN"
X-Content-Type-Options = "nosniff"
X-XSS-Protection = "1; mode=block"
Referrer-Policy = "strict-origin-when-cross-origin"
Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# ---- Cache static assets aggressively ----
[[headers]]
for = "*.css"
[headers.values]
Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
for = "*.js"
[headers.values]
Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
for = "*.jpg"
[headers.values]
Cache-Control = "public, max-age=2592000"

[[headers]]
for = "*.png"
[headers.values]
Cache-Control = "public, max-age=2592000"

[[headers]]
for = "*.webp"
[headers.values]
Cache-Control = "public, max-age=2592000"

[build.environment]
NODE_VERSION = "18"
